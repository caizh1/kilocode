# chipmate_change - new file
name: Check ChipMate generated artifacts

on:
  pull_request:
    paths:
      - ".gitignore"
      - ".github/workflows/check-chipmate-generated-artifacts.yml"
      - ".chipmate/**"
      - ".chipmate/**"
      - "script/check-chipmate-generated-artifacts.ts"
  workflow_dispatch:

jobs:
  check:
    name: Check ChipMate generated artifacts
    if: github.repository == 'ChipMate-Org/chipmate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # chipmate_change
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: oven-sh/setup-bun@v2

      - name: Run check
        run: bun run script/check-chipmate-generated-artifacts.ts
