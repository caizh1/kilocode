id = "chipmate"
name = "ChipMate"
description = "The open source coding agent."
version = "7.4.21"
schema_version = 1
authors = ["Anomaly"]
repository = "https://github.com/ChipMate-Org/chipmate"

[agent_servers.opencode]
name = "ChipMate"
icon = "./icons/opencode.svg"

[agent_servers.opencode.targets.darwin-aarch64]
archive = "https://github.com/ChipMate-Org/chipmate/releases/download/v7.4.21/opencode-darwin-arm64.zip"
cmd = "./opencode"
args = ["acp"]

[agent_servers.opencode.targets.darwin-x86_64]
archive = "https://github.com/ChipMate-Org/chipmate/releases/download/v7.4.21/opencode-darwin-x64.zip"
cmd = "./opencode"
args = ["acp"]

[agent_servers.opencode.targets.linux-aarch64]
archive = "https://github.com/ChipMate-Org/chipmate/releases/download/v7.4.21/opencode-linux-arm64.tar.gz"
cmd = "./opencode"
args = ["acp"]

[agent_servers.opencode.targets.linux-x86_64]
archive = "https://github.com/ChipMate-Org/chipmate/releases/download/v7.4.21/opencode-linux-x64.tar.gz"
cmd = "./opencode"
args = ["acp"]

[agent_servers.opencode.targets.windows-x86_64]
archive = "https://github.com/ChipMate-Org/chipmate/releases/download/v7.4.21/opencode-windows-x64.zip"
cmd = "./opencode.exe"
args = ["acp"]
